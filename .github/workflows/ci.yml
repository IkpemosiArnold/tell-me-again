name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      # the speech model (41 MB) comes from Hugging Face; keep it between runs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/tell-me-again-e2e
          key: e2e-models-whisper-tiny-en-v1
      - run: npm run build
      - run: npm run test:e2e
        env:
          E2E_PROFILE_DIR: ~/.cache/tell-me-again-e2e
